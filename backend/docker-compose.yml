version: "3.8"

services:
  mongodb:
    image: mongo:8.2.6
    container_name: smyp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: smyp-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongodb

volumes:
  mongo-data:
