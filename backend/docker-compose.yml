services:
  mongodb:
    image: mongo:8.2.6
    container_name: smyp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: smyp-api
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file:
      - .env.prod
    depends_on:
      - mongodb

volumes:
  mongo-data:
