services:
  mongodb:
    image: mongo:8.2.6
    container_name: smyp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  anomaly:
    build:
      context: ../anomaly
      dockerfile: Dockerfile
    container_name: smyp-anomaly
    ports:
      - "8001:8000"
    env_file:
      - ../anomaly/.env
    restart: unless-stopped

  api:
    build: .
    container_name: smyp-api
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file:
      - .env.prod
    environment:
      - ANOMALY_API_URL=http://anomaly:8000
    depends_on:
      - mongodb
      - anomaly

volumes:
  mongo-data:
